<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181a1d" />
    <title>Sem conexão — Centro pessoal</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #181a1d;
        color: #ecf0f3;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        color: #a8c7fa;
        font-size: 1.6rem;
      }
      p {
        line-height: 1.6;
      }
      button {
        margin-top: 16px;
        padding: 14px 24px;
        border: 1px solid #a8c7fa;
        border-radius: 16px;
        background: #20242c;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #a8c7fa;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão.</h1>
      <p>Conecte-se à internet para abrir o Centro pessoal</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
